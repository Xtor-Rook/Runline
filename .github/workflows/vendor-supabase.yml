name: Vendor pinned Supabase client

on:
  push:
    paths:
      - '.github/workflows/vendor-supabase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned package through npm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vendor_tmp vendor
          mkdir -p .vendor_tmp vendor
          cd .vendor_tmp
          npm pack @supabase/supabase-js@2.118.0
          tar -xzf supabase-supabase-js-2.118.0.tgz
          cp package/dist/umd/supabase.min.js ../vendor/supabase-2.118.0.min.js
          cd ..
          rm -rf .vendor_tmp
      - name: Commit vendored client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-2.118.0.min.js
          if git diff --cached --quiet; then
            echo "Vendored client already current."
            exit 0
          fi
          git commit -m "Vendor pinned Supabase client 2.118.0"
          git push
